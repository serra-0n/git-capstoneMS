<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Profile | ResortHub</title>

        <!-- Shared CSS -->
        <link rel="stylesheet" href="../../css//client-global/style..css" />

        <link rel="stylesheet" href="../../css//client-global/nav.css" />

        <link rel="stylesheet" href="../../css//client-global/sidebar.css" />

        <!-- Page CSS -->
        <link rel="stylesheet" href="../../css/client/profile.css" />

        <!-- Lucide Icons -->
        <script src="https://unpkg.com/lucide@latest" defer></script>

        <!-- Page JavaScript -->
        <script src="../../js/client/Profile.js" defer></script>
    </head>

    <body>
        <div class="client-app" id="clientApp">
            <!-- TOP NAVIGATION -->

            <header class="client-topbar">
                <div class="topbar-left">
                    <a
                        href="Dashboard.html"
                        class="client-brand"
                        aria-label="ResortHub Dashboard"
                    >
                        <i data-lucide="building-2"></i>

                        <span> ResortHub </span>
                    </a>

                    <button
                        type="button"
                        class="sidebar-toggle"
                        id="sidebarToggle"
                        aria-label="Toggle sidebar"
                        aria-expanded="true"
                    >
                        <i data-lucide="menu"></i>
                    </button>
                </div>

                <div class="topbar-right">
                    <button
                        type="button"
                        class="client-profile"
                        id="clientProfileButton"
                        aria-label="Client profile"
                    >
                        <span class="profile-avatar">
                            <i data-lucide="user"></i>
                        </span>

                        <span class="profile-info">
                            <strong id="clientDisplayName"> Client </strong>

                            <small> Client </small>
                        </span>

                        <i
                            class="profile-chevron"
                            data-lucide="chevron-down"
                        ></i>
                    </button>
                </div>
            </header>

            <!-- PAGE LAYOUT -->

            <div class="client-layout">
                <!-- SIDEBAR -->

                <aside class="client-sidebar" id="clientSidebar">
                    <nav
                        class="sidebar-navigation"
                        aria-label="Client navigation"
                    >
                        <!-- Dashboard -->

                        <a href="Dashboard.html" class="sidebar-link">
                            <i data-lucide="layout-dashboard"></i>

                            <span> Dashboard </span>
                        </a>

                        <!-- Booking -->

                        <div class="sidebar-section">
                            <span class="sidebar-section-title"> BOOKING </span>

                            <a href="Reservations.html" class="sidebar-link">
                                <i data-lucide="calendar-plus"></i>

                                <span> New Reservation </span>
                            </a>

                            <a href="MyReservations.html" class="sidebar-link">
                                <i data-lucide="calendar-days"></i>

                                <span> My Reservations </span>
                            </a>

                            <a href="Resorts.html" class="sidebar-link">
                                <i data-lucide="building"></i>

                                <span> Resorts </span>
                            </a>
                        </div>

                        <!-- Payment -->

                        <div class="sidebar-section">
                            <span class="sidebar-section-title"> PAYMENT </span>

                            <a href="Payments.html" class="sidebar-link">
                                <i data-lucide="wallet-cards"></i>

                                <span> Billing & Payment </span>
                            </a>
                        </div>

                        <!-- Documents -->

                        <div class="sidebar-section">
                            <span class="sidebar-section-title">
                                DOCUMENTS
                            </span>

                            <a href="UploadDocuments.html" class="sidebar-link">
                                <i data-lucide="file-up"></i>

                                <span> Upload Documents </span>
                            </a>
                        </div>

                        <!-- Status -->

                        <div class="sidebar-section">
                            <span class="sidebar-section-title"> STATUS </span>

                            <a
                                href="ReservationStatus.html"
                                class="sidebar-link"
                            >
                                <i data-lucide="clock-3"></i>

                                <span> Reservation Status </span>
                            </a>

                            <a href="Notifications.html" class="sidebar-link">
                                <i data-lucide="bell"></i>

                                <span> Notifications </span>
                            </a>
                        </div>

                        <!-- Account -->

                        <div class="sidebar-section">
                            <span class="sidebar-section-title"> ACCOUNT </span>

                            <a
                                href="Profile.html"
                                class="sidebar-link active"
                                aria-current="page"
                            >
                                <i data-lucide="user-round"></i>

                                <span> Profile </span>
                            </a>
                        </div>
                    </nav>
                </aside>

                <!-- MAIN CONTENT -->

                <main class="client-main">
                    <div class="page-container">
                        <!-- PAGE HEADER -->

                        <div class="page-header">
                            <div>
                                <h1>Profile</h1>

                                <p>View and manage your account information.</p>
                            </div>
                        </div>

                        <!-- PROFILE OVERVIEW -->

                        <section class="card profile-overview-card">
                            <div class="profile-overview">
                                <div class="profile-overview-avatar">
                                    <i data-lucide="user"></i>
                                </div>

                                <div class="profile-overview-information">
                                    <h2 id="profileDisplayName">—</h2>

                                    <p id="profileDisplayEmail">—</p>

                                    <span class="profile-role">
                                        <i data-lucide="user-round"></i>

                                        <span> Client </span>
                                    </span>
                                </div>
                            </div>
                        </section>

                        <!-- ACCOUNT INFORMATION -->

                        <section class="card profile-information-card">
                            <div class="card-header">
                                <div class="card-heading">
                                    <span class="card-heading-icon">
                                        <i data-lucide="user-round"></i>
                                    </span>

                                    <div>
                                        <h2>Account Information</h2>

                                        <p>Your client account information.</p>
                                    </div>
                                </div>
                            </div>

                            <div class="card-body">
                                <form id="profileForm" novalidate>
                                    <!-- Client ID -->

                                    <input
                                        type="hidden"
                                        id="clientId"
                                        name="client_id"
                                    />

                                    <div class="profile-form-grid">
                                        <!-- Full Name -->

                                        <div class="form-group">
                                            <label for="fullName">
                                                Full Name
                                            </label>

                                            <div class="profile-input-wrapper">
                                                <i data-lucide="user"></i>

                                                <input
                                                    type="text"
                                                    id="fullName"
                                                    name="full_name"
                                                    autocomplete="name"
                                                    required
                                                />
                                            </div>
                                        </div>

                                        <!-- Email -->

                                        <div class="form-group">
                                            <label for="emailAddress">
                                                Email Address
                                            </label>

                                            <div class="profile-input-wrapper">
                                                <i data-lucide="mail"></i>

                                                <input
                                                    type="email"
                                                    id="emailAddress"
                                                    name="email"
                                                    autocomplete="email"
                                                    required
                                                />
                                            </div>
                                        </div>

                                        <!-- Contact Number -->

                                        <div class="form-group">
                                            <label for="contactNumber">
                                                Contact Number
                                            </label>

                                            <div class="profile-input-wrapper">
                                                <i data-lucide="phone"></i>

                                                <input
                                                    type="tel"
                                                    id="contactNumber"
                                                    name="contact_number"
                                                    autocomplete="tel"
                                                    required
                                                />
                                            </div>
                                        </div>

                                        <!-- Account Role -->

                                        <div class="form-group">
                                            <label for="accountRole">
                                                Account Role
                                            </label>

                                            <div class="profile-input-wrapper">
                                                <i
                                                    data-lucide="shield-check"
                                                ></i>

                                                <input
                                                    type="text"
                                                    id="accountRole"
                                                    name="role"
                                                    value="Client"
                                                    readonly
                                                />
                                            </div>
                                        </div>
                                    </div>

                                    <!-- FORM MESSAGE -->

                                    <div
                                        class="profile-form-message"
                                        id="profileFormMessage"
                                        role="status"
                                        aria-live="polite"
                                        hidden
                                    ></div>

                                    <!-- FORM ACTIONS -->

                                    <div class="profile-form-actions">
                                        <button
                                            type="submit"
                                            class="primary-button"
                                            id="saveProfileButton"
                                        >
                                            <i data-lucide="save"></i>

                                            <span> Save Changes </span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </section>
                    </div>
                </main>
            </div>
        </div>
    </body>
</html>
